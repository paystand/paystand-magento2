stages:
  - test

composer-metadata:
  stage: test
  image: composer:2
  script:
    - composer validate --no-check-publish

php-security-contract:
  stage: test
  image: php:${PHP_VERSION}-cli
  parallel:
    matrix:
      - PHP_VERSION: ["8.3", "8.4"]
  script:
    - find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
    - php Test/Standalone/run-security-contract.php
    - php Test/Standalone/run-orderability-contract.php
    - php Test/Standalone/run-attempt-repository-contract.php
    - php Test/Standalone/run-attempt-service-contract.php

javascript-syntax:
  stage: test
  image: node:22
  script:
    - node --check view/frontend/web/js/view/payment/method-renderer/paystandmagento-directpost.js
    - node --check view/frontend/web/js/hyva-checkout/paystand-method.js
    - node --check view/frontend/web/js/paystand-nav-trace.js
